services:
  - type: web
    name: mii-fitt-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "10"
      - key: APP_URL
        sync: false
      - key: PORT
        value: "4242"
