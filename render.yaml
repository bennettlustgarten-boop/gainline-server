services:
  - type: web
    name: gainline-server
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "0"
      - key: APP_URL
        sync: false
      - key: PORT
        value: "4242"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
    # data.db and /uploads live under DATA_DIR (see lib/dataDir.js), which
    # must point at a Render Disk (https://render.com/docs/disks) — not the
    # free plan's local filesystem, which gets wiped on every deploy/restart.
    # This disk is created once via the dashboard, not by this blueprint;
    # the mountPath below just documents where it needs to live to match
    # DATA_DIR above.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
