<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password — Gainline</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="/"><svg class="brand-icon" viewBox="0 0 24 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="12" cy="4" rx="4" ry="3.3" fill="currentColor"/><path d="M10 7.3 L10 13.3 M14 7.3 L14 13.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.5 14.2 L9 13 L15 13 L20.5 14.2 L17.3 17 L6.7 17 Z" fill="currentColor"/><path d="M9.4 17 L14.6 17 L12.6 31 L12 33.4 L11.4 31 Z" fill="var(--accent)"/></svg>Gain<span>line</span></a>
  </header>

  <main class="page">
    <h1>Forgot your password?</h1>
    <p class="lede">Enter the email on your account and we'll send you a link to set a new password.</p>

    <form id="forgot-form" class="card">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com" />

      <button type="submit" id="submit-btn">Send reset link</button>
      <div class="status" id="status"></div>
    </form>

    <p class="hint" style="margin-top:16px;">Remembered it? <a href="/login.html">Log in</a></p>
    <a class="back-link" href="/">&larr; Back home</a>
  </main>

  <script src="/app.js"></script>
  <script>
    setupSupportLink();
    const form = document.getElementById("forgot-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      submitBtn.disabled = true;
      showStatus(statusEl, "Sending...", "info");
      try {
        await api("/auth/forgot-password", { method: "POST", body: JSON.stringify({ email }) });
        showStatus(statusEl, "If that email has an account, a reset link is on its way — check your inbox.", "info");
      } catch (err) {
        showStatus(statusEl, err.message, "error");
        submitBtn.disabled = false;
      }
    });
  </script>

  <footer class="site-footer">
    <span>&copy; 2026 Gainline</span>
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/terms.html">Terms of Use</a>
  </footer>
</body>
</html>
