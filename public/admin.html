<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Gainline</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="/"><svg class="brand-icon" viewBox="0 0 24 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="12" cy="4" rx="4" ry="3.3" fill="currentColor"/><path d="M10 7.3 L10 13.3 M14 7.3 L14 13.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.5 14.2 L9 13 L15 13 L20.5 14.2 L17.3 17 L6.7 17 Z" fill="currentColor"/><path d="M9.4 17 L14.6 17 L12.6 31 L12 33.4 L11.4 31 Z" fill="var(--accent)"/></svg>Gain<span>line</span></a>
  </header>

  <main class="page">
    <h1>Admin</h1>
    <p class="lede">Operator access only.</p>

    <form id="admin-login-form" class="card">
      <label for="username">Username</label>
      <input type="text" id="username" required autocomplete="username" />

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" />

      <button type="submit" id="submit-btn">Log in</button>
      <div class="status" id="status"></div>
    </form>
  </main>

  <script src="/app.js"></script>
  <script>
    const form = document.getElementById("admin-login-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      showStatus(statusEl, "Logging in...", "info");
      try {
        await api("/admin/login", { method: "POST", body: JSON.stringify({ username, password }) });
        window.location.href = "/admin-dashboard.html";
      } catch (err) {
        showStatus(statusEl, err.message, "error");
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
