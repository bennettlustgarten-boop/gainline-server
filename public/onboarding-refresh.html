<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboarding link expired — Gainline</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="/"><svg class="brand-icon" viewBox="0 0 24 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="12" cy="4" rx="4" ry="3.3" fill="currentColor"/><path d="M10 7.3 L10 13.3 M14 7.3 L14 13.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.5 14.2 L9 13 L15 13 L20.5 14.2 L17.3 17 L6.7 17 Z" fill="currentColor"/><path d="M9.4 17 L14.6 17 L12.6 31 L12 33.4 L11.4 31 Z" fill="var(--accent)"/></svg>Gain<span>line</span></a>
  </header>

  <main class="page">
    <h1>That link expired</h1>
    <p class="lede">Stripe's onboarding links only last a little while. No problem — let's get you a fresh one.</p>

    <div class="card">
      <button id="retry-btn">Get a new onboarding link</button>
      <div class="status" id="status"></div>
    </div>

    <a class="back-link" href="/coach-dashboard.html">&larr; Back to dashboard</a>
  </main>

  <script src="/app.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const retryBtn = document.getElementById("retry-btn");

    (async () => {
      await requireLogin("coach");
    })();

    retryBtn.addEventListener("click", async () => {
      retryBtn.disabled = true;
      showStatus(statusEl, "Requesting a new link...", "info");
      try {
        const { url } = await api("/coach/onboard", { method: "POST" });
        window.location.href = url;
      } catch (err) {
        showStatus(statusEl, err.message, "error");
        retryBtn.disabled = false;
      }
    });
  </script>

  <footer class="site-footer">
    <span>&copy; 2026 Gainline</span>
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/terms.html">Terms of Use</a>
  </footer>
</body>
</html>
