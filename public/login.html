<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Gainline</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="/"><svg class="brand-icon" viewBox="0 0 24 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="12" cy="4" rx="4" ry="3.3" fill="currentColor"/><path d="M10 7.3 L10 13.3 M14 7.3 L14 13.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.5 14.2 L9 13 L15 13 L20.5 14.2 L17.3 17 L6.7 17 Z" fill="currentColor"/><path d="M9.4 17 L14.6 17 L12.6 31 L12 33.4 L11.4 31 Z" fill="var(--accent)"/></svg>Gain<span>line</span></a>
  </header>

  <main class="page">
    <h1>Log in</h1>
    <p class="lede">Welcome back.</p>

    <form id="login-form" class="card">
      <label for="username">Username</label>
      <input type="text" id="username" required placeholder="jordanlee" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" />

      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="Your password" autocomplete="current-password" />
      <p class="hint" style="margin-top:6px; text-align:right;"><a href="/forgot-password.html">Forgot password?</a></p>

      <button type="submit" id="submit-btn">Log in</button>
      <button type="button" id="biometric-btn" class="secondary" style="display:none; width:100%; margin-top:10px;"></button>
      <div class="status" id="status"></div>
    </form>

    <p class="hint">No account yet? <a href="/signup.html">Sign up</a></p>
    <p class="hint" style="margin-top:8px;">Having trouble with the site? <a href="#" id="support-link">Contact support</a></p>

    <a class="back-link" href="/">&larr; Back home</a>
  </main>

  <script src="/app.js"></script>
  <script src="/native.js"></script>
  <script>
    setupSupportLink();
    const form = document.getElementById("login-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      showStatus(statusEl, "Logging in...", "info");
      try {
        const { user } = await api("/auth/login", { method: "POST", body: JSON.stringify({ username, password }) });
        // In the iOS app: offer to save this login for Face ID next time.
        await GainlineNative.offerBiometricLogin(username, password);
        goToDashboard(user);
      } catch (err) {
        showStatus(statusEl, err.message, "error");
        submitBtn.disabled = false;
      }
    });

    function goToDashboard(user) {
      const next = safeRelativePath(qs("next"));
      window.location.href = next || (user.role === "coach" ? "/coach-dashboard.html" : "/client-dashboard.html");
    }

    // "Log in with Face ID" — only inside the iOS app, and only once a login
    // has been saved to the Keychain on this device.
    (async () => {
      if (!GainlineNative.hasSavedLogin()) return;
      const label = await GainlineNative.biometryLabel();
      if (!label) return;
      const bioBtn = document.getElementById("biometric-btn");
      const savedUser = GainlineNative.savedLoginUsername();
      bioBtn.textContent = savedUser ? `Log in with ${label} as @${savedUser}` : `Log in with ${label}`;
      bioBtn.style.display = "block";
      bioBtn.addEventListener("click", async () => {
        let creds;
        try {
          creds = await GainlineNative.unlockSavedLogin();
        } catch (err) {
          // Cancelling is normal — anything else gets shown instead of
          // silently doing nothing.
          const msg = err?.message || "";
          if (!/cancel/i.test(msg)) showStatus(statusEl, `${label} didn't work${msg ? ` (${msg})` : ""}. Log in with your password instead.`, "error");
          return;
        }
        bioBtn.disabled = true;
        showStatus(statusEl, "Logging in...", "info");
        try {
          const { user } = await api("/auth/login", { method: "POST", body: JSON.stringify({ username: creds.username, password: creds.password }) });
          goToDashboard(user);
        } catch (err) {
          // Most likely the password was changed since it was saved.
          await GainlineNative.forgetLogin();
          bioBtn.style.display = "none";
          showStatus(statusEl, `${err.message} — log in with your password to set up ${label} again.`, "error");
        }
      });
    })();
  </script>

  <footer class="site-footer">
    <span>&copy; 2026 Gainline</span>
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/terms.html">Terms of Use</a>
  </footer>
</body>
</html>
