<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set a new password — Gainline</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="/"><svg class="brand-icon" viewBox="0 0 24 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="12" cy="4" rx="4" ry="3.3" fill="currentColor"/><path d="M10 7.3 L10 13.3 M14 7.3 L14 13.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.5 14.2 L9 13 L15 13 L20.5 14.2 L17.3 17 L6.7 17 Z" fill="currentColor"/><path d="M9.4 17 L14.6 17 L12.6 31 L12 33.4 L11.4 31 Z" fill="var(--accent)"/></svg>Gain<span>line</span></a>
  </header>

  <main class="page">
    <h1>Set a new password</h1>

    <form id="reset-form" class="card">
      <label for="password">New password</label>
      <input type="password" id="password" required minlength="8" placeholder="At least 8 characters" />

      <button type="submit" id="submit-btn">Set new password</button>
      <div class="status" id="status"></div>
    </form>

    <a class="back-link" href="/login.html">&larr; Back to login</a>
  </main>

  <script src="/app.js"></script>
  <script>
    setupSupportLink();
    const token = qs("token");
    const form = document.getElementById("reset-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    if (!token) {
      form.style.display = "none";
      showStatus(statusEl, "This reset link is incomplete. Request a new one from the login page.", "error");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      submitBtn.disabled = true;
      showStatus(statusEl, "Saving...", "info");
      try {
        await api("/auth/reset-password", { method: "POST", body: JSON.stringify({ token, password }) });
        showStatus(statusEl, "Password updated — you can log in with it now.", "info");
        form.style.display = "none";
        const link = document.createElement("a");
        link.href = "/login.html";
        link.className = "button";
        link.style.marginTop = "12px";
        link.textContent = "Go to login";
        statusEl.after(link);
      } catch (err) {
        showStatus(statusEl, err.message, "error");
        submitBtn.disabled = false;
      }
    });
  </script>

  <footer class="site-footer">
    <span>&copy; 2026 Gainline</span>
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/terms.html">Terms of Use</a>
  </footer>
</body>
</html>
