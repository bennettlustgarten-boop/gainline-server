<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify your email — Gainline</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site">
    <a class="brand" href="/"><svg class="brand-icon" viewBox="0 0 24 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><ellipse cx="12" cy="4" rx="4" ry="3.3" fill="currentColor"/><path d="M10 7.3 L10 13.3 M14 7.3 L14 13.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M3.5 14.2 L9 13 L15 13 L20.5 14.2 L17.3 17 L6.7 17 Z" fill="currentColor"/><path d="M9.4 17 L14.6 17 L12.6 31 L12 33.4 L11.4 31 Z" fill="var(--accent)"/></svg>Gain<span>line</span></a>
  </header>

  <main class="page">
    <h1>Verifying your email&hellip;</h1>

    <div class="card">
      <div id="result">One moment...</div>
      <div id="actions" style="margin-top:12px;"></div>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    const resultEl = document.getElementById("result");
    const actionsEl = document.getElementById("actions");

    function goToDashboard() {
      const link = document.createElement("a");
      link.href = "/login.html";
      link.className = "button";
      link.textContent = "Go to login";
      actionsEl.appendChild(link);
    }

    (async () => {
      const token = qs("token");
      if (!token) {
        resultEl.innerHTML = '<span class="pill pending">Missing link</span> &nbsp;This verification link is incomplete.';
        goToDashboard();
        return;
      }
      try {
        await api("/auth/verify-email", { method: "POST", body: JSON.stringify({ token }) });
        resultEl.innerHTML = '<span class="pill ok">Verified</span> &nbsp;Your email is confirmed — you can continue using Gainline.';
        goToDashboard();
      } catch (err) {
        resultEl.innerHTML = `<span class="pill pending">Not verified</span> &nbsp;${escapeHtml(err.message)}`;
        goToDashboard();
      }
    })();
  </script>

  <footer class="site-footer">
    <span>&copy; 2026 Gainline</span>
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/terms.html">Terms of Use</a>
  </footer>
</body>
</html>
